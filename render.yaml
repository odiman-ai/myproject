services:
  - type: web
    name: spms-backend
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn backend.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: SPMS_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: spms-database
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SPMS_CORS_ORIGINS
        value: https://your-frontend-domain.com

databases:
  - name: spms-database
    databaseName: spms_db
    user: spms_user