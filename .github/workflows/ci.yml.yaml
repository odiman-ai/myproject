name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort mypy pytest

    - name: Lint & Format
      run: |
        black --check .
        isort --check-only .
        flake8 .
        mypy .

    - name: Run tests
      run: pytest --maxfail=1 --disable-warnings -q

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: your-dockerhub-username/fastapi-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
    - name: Deploy to server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
        "docker pull your-dockerhub-username/fastapi-app:latest && \
         docker stop fastapi-app || true && \
         docker rm fastapi-app || true && \
         docker run -d --name fastapi-app -p 80:80 \
           -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
           your-dockerhub-username/fastapi-app:latest && \
         docker exec fastapi-app alembic upgrade head"

